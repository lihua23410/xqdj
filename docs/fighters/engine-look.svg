<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="-8 -8 116 116" style="--engine-metal:#ba6950;--engine-hot:#eb9e45;--engine-heat:60%;--engine-flare:0.8;--engine-pulse:0.5"><title>内燃机：四向活塞与中央飞轮</title><style>.engine-case {
  fill: transparent;
  stroke: var(--engine-metal);
  stroke-width: 5;
}
.engine-case-seam {
  fill: none;
  stroke: #0c1118;
  stroke-width: 2;
  stroke-dasharray: 24 4 8 4;
}
.engine-jacket {
  fill: color-mix(in srgb, #242c32, #a72c16 var(--engine-heat, 0%));
  stroke: var(--engine-hot);
  stroke-width: 1.5;
}
.engine-cylinder {
  fill: var(--engine-metal);
  stroke: #13191e;
  stroke-width: 1.5;
}
.engine-fins {
  fill: none;
  stroke: color-mix(in srgb, #a6b2b8, #ff9f65 var(--engine-heat, 0%));
  stroke-width: 2;
}
.engine-bore {
  fill: #10171d;
  stroke: var(--engine-hot);
  stroke-width: 1;
}
.engine-rod {
  fill: #8c999f;
  stroke: #303a40;
  stroke-width: 1;
}
.engine-piston-head {
  fill: color-mix(in srgb, #d0d9db, #ffc07d var(--engine-heat, 0%));
  stroke: #303a40;
  stroke-width: 1;
}
.engine-piston-groove {
  fill: none;
  stroke: #53616a;
  stroke-width: 1;
}
.engine-combustion {
  fill: color-mix(in srgb, #472a21, #f66a24 var(--engine-heat, 0%));
  stroke: #151c22;
  stroke-width: 3;
  opacity: calc(0.7 + var(--engine-pulse, 0) * 0.3);
}
.engine-flywheel-rim {
  fill: none;
  stroke: var(--engine-hot);
  stroke-width: 3;
  stroke-dasharray: 3 2;
}
.engine-flywheel {
  fill: #283039;
  stroke: #bac2c3;
  stroke-width: 3.5;
  stroke-linecap: round;
}
.engine-flywheel .engine-crankpin {
  fill: #ffcc85;
  stroke: #613b23;
  stroke-width: 1;
}
.engine-ignition {
  fill: #fff0bf;
  opacity: var(--engine-flare, 0.3);
  filter: drop-shadow(0 0 5px #ff6c26);
}
.engine-bolt circle {
  fill: #b5bfc3;
  stroke: #171d24;
  stroke-width: 1.5;
}
.engine-bolt path {
  stroke: #424d54;
  stroke-width: 1;
}
